# Test configuration for Delta Lake CDF source integration tests with MinIO

features:
- delta-lake-cdf-integration-tests

test_filter: '::delta_lake_cdf::integration_tests::'

runner:
  env:
    MINIO_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_REGION: us-east-1
    AWS_ALLOW_HTTP: "true"

matrix:
  version: ['latest']

# Changes to these files/paths will invoke the integration test in CI
# Expressions are evaluated using https://github.com/micromatch/picomatch
paths:
- "src/sources/delta_lake_cdf/**"
- "tests/integration/delta-lake-cdf/**"
